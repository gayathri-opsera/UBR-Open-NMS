[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ubrnms-device-simulator"
version = "1.0.0"
description = "BTS/CPE device fleet simulator for UBR NMS integration test harness"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "prometheus-client>=0.20",
    "asyncio-mqtt>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
]
