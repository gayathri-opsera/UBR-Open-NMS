[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ubrnms-e2e-tests"
version = "1.0.0"
description = "End-to-end integration tests for UBR NMS critical paths"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "httpx>=0.27",
    "anyio[trio]>=4.0",
    "junit-xml>=1.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
markers = [
    "slo: SLO validation tests",
    "alarm: alarm pipeline tests",
    "kpi: KPI pipeline tests",
    "config: config push tests",
    "onboarding: device onboarding tests",
    "auth: authentication tests",
]
