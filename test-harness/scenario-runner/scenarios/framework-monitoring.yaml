---
name: framework-monitoring-role-filtered-ui
description: "WO-015: Adaptive UI template excludes unauthorized parameters and groups for restricted_viewer role"
timeout_seconds: 60

setup:
  - action: load_simulator_profile
    profile: "test-harness/device-simulator/profiles/framework-monitoring.yaml"
    device_filter: ["fw-dev-success-001"]

steps:
  - name: fetch-ui-template-as-restricted-viewer
    action: http_get
    url: "${API_GW_URL}/api/framework/v1/devices/${FW_DEVICE_SUCCESS_ID:fw-dev-success-001}/ui-template"
    headers:
      Authorization: "Bearer ${RESTRICTED_VIEWER_TOKEN}"
    expect_status: 200
    retry:
      times: 5
      delay_seconds: 1

  - name: assert-optical-group-absent
    action: framework_assert
    type: role_filtered_absence
    response_context_key: "ui_template_response"
    absent_group_ids: ["grp-optical"]
    absent_parameter_ids: ["rx_power", "tx_power"]

  - name: assert-chassis-group-present
    action: assert
    condition: "${visible_group_ids} contains 'grp-chassis'"
    fail_message: "restricted_viewer must still see grp-chassis"

assertions:
  - type: "equals"
    actual: "${optical_group_present}"
    expected: "false"
    description: "grp-optical is absent from restricted_viewer response"

  - type: "equals"
    actual: "${chassis_group_present}"
    expected: "true"
    description: "grp-chassis is visible to restricted_viewer"

---
name: framework-monitoring-rerun-idempotency
description: "WO-015: Scenario reruns must not pass because of stale persisted values from a prior run"
timeout_seconds: 60

steps:
  - name: wait-for-new-values
    action: http_get
    url: "${PARAMETER_POLLER_URL:http://localhost:8084}/api/framework/v1/devices/${FW_DEVICE_SUCCESS_ID:fw-dev-success-001}/parameters/current"
    expect_status: 200
    retry:
      times: 10
      delay_seconds: 4

  - name: assert-collected-at-is-recent
    action: assert
    condition: "${max_collected_at_age_seconds} < 120"
    fail_message: "All parameter values must have been collected within the last 2 minutes, not from a prior run"

assertions:
  - type: "equals"
    actual: "${stale_carried_over}"
    expected: "false"
    description: "No values carried over from a prior scenario run"
