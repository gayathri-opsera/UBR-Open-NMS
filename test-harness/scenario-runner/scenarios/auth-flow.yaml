name: auth-flow
description: "Auth flow: login → access API → refresh token → logout"
timeout_seconds: 60

setup: []

steps:
  - name: login
    action: http_post
    url: "${AUTH_URL}/api/v1/auth/login"
    body:
      username: "${TEST_USERNAME:admin}"
      password: "${TEST_PASSWORD:admin123}"
    expect_status: 200
    capture:
      access_token: "$.accessToken"
      refresh_token: "$.refreshToken"

  - name: access-protected-api
    action: http_get
    url: "${ALARM_URL}/api/v1/alarms"
    headers:
      Authorization: "Bearer ${access_token}"
    expect_status: 200

  - name: refresh-token
    action: http_post
    url: "${AUTH_URL}/api/v1/auth/refresh"
    body:
      refreshToken: "${refresh_token}"
    expect_status: 200
    capture:
      access_token: "$.accessToken"

  - name: logout
    action: http_post
    url: "${AUTH_URL}/api/v1/auth/logout"
    headers:
      Authorization: "Bearer ${access_token}"
    expect_status: 200

cleanup: []
