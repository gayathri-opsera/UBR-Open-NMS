# ──────────────────────────────────────────────────────────────────
# WO-048: Southbound Contract Tests
# Validates exact device-facing wire contract for UBR firmware
# ──────────────────────────────────────────────────────────────────
name: southbound-discovery-registry-contract
description: "WO-048: Discovery registry returns exact Consul-style KV format with required service keys"
timeout_seconds: 30

steps:
  - name: discovery-registry-exact-path
    action: http_get
    url: "${DISCOVERY_URL}/discovery/v1/kv/services?recurse=1"
    expect_status: 200
    expect_body_structure:
      - type: array
      - items_have_keys: ["LockIndex", "Key", "Flags", "Value", "CreateIndex", "ModifyIndex"]

  - name: verify-required-service-keys
    action: assert_kv_keys
    required_keys:
      - "services/auth"
      - "services/checkin"
      - "services/realtime"
    kv_response: "${DISCOVERY_REGISTRY_RESPONSE}"

  - name: verify-base64-metadata
    action: assert_base64_json
    kv_key: "services/auth"
    expect_fields: ["url", "version"]

---
name: southbound-mtls-cert-invalid
description: "WO-048: Invalid mTLS certificate returns 495 MTLS_CERT_INVALID"
timeout_seconds: 30

steps:
  - name: trigger-mtls-cert-invalid
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/auth"
    mtls_cert: "invalid-cert-context"
    expect_status: 495
    expect_body:
      reason: "MTLS_CERT_INVALID"
      category: "auth_failure"
      action: "contact_support"
    expect_header_absent: ["Retry-After", "X-Retry-Jitter-Max", "Location"]

---
name: southbound-mtls-no-cert
description: "WO-048: Missing client certificate returns 496 MTLS_NO_CERT"
timeout_seconds: 30

steps:
  - name: trigger-mtls-no-cert
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/auth"
    mtls_cert: null
    expect_status: 496
    expect_body:
      reason: "MTLS_NO_CERT"
      category: "auth_failure"
      action: "contact_support"
    expect_header_absent: ["Retry-After", "X-Retry-Jitter-Max", "Location"]

---
name: southbound-hmac-invalid-signature
description: "WO-048: Invalid HMAC signature returns 462 HMAC_INVALID"
timeout_seconds: 30

steps:
  - name: check-in-invalid-hmac
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/check-in"
    body:
      serialNumber: "HMAC-TEST-001"
      macAddress: "AA:BB:CC:DD:EE:FF"
      deviceType: "BTS"
      softwareVersion: "1.0.0"
      signature: "invalid-signature-string"
    headers:
      Auth-Info: "serial=HMAC-TEST-001,nonce=test123,timestamp=1234567890"
      Auth-Signature: "invalid-signature"
    expect_status: 462
    expect_body:
      reason: "HMAC_INVALID"
      category: "auth_failure"
      action: "re_authenticate"
    expect_header_absent: ["Retry-After", "X-Retry-Jitter-Max"]

---
name: southbound-hmac-stale-timestamp
description: "WO-048: Stale timestamp returns 462 with STALE_TIMESTAMP reason"
timeout_seconds: 30

steps:
  - name: check-in-stale-timestamp
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/check-in"
    body_from_fixture: "fixtures/stale-timestamp-profile.json"
    expect_status: 462
    expect_body:
      reason: "HMAC_INVALID"
      category: "auth_failure"
      detail: "timestamp_stale"

---
name: southbound-nonce-replay
description: "WO-048: Replayed nonce is rejected with HMAC_INVALID"
timeout_seconds: 60

steps:
  - name: first-check-in-with-nonce
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/check-in"
    body_from_fixture: "fixtures/valid-request.json"
    expect_status: 200

  - name: replay-same-nonce
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/check-in"
    body_from_fixture: "fixtures/reused-nonce.json"
    expect_status: 462
    expect_body:
      reason: "HMAC_INVALID"
      detail: "nonce_replayed"

---
name: southbound-rate-limited-with-retry-headers
description: "WO-048: Rate limit returns 429 with Retry-After and X-Retry-Jitter-Max"
timeout_seconds: 30

steps:
  - name: trigger-rate-limit
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/check-in"
    headers:
      X-Simulate-Rate-Limit: "true"
    body:
      serialNumber: "RATE-TEST-001"
      macAddress: "AA:BB:CC:DD:EE:01"
      deviceType: "CPE"
      softwareVersion: "1.0.0"
    expect_status: 429
    expect_body:
      reason: "RATE_LIMITED"
      category: "retryable"
      action: "retry_with_backoff"
    expect_header_present: ["Retry-After", "X-Retry-Jitter-Max"]
    expect_header_numeric: ["Retry-After", "X-Retry-Jitter-Max"]

---
name: southbound-nms-failover-with-location
description: "WO-048: Failover returns 302 NMS_FAILOVER with Location header"
timeout_seconds: 30

steps:
  - name: trigger-failover
    action: http_get
    url: "${DISCOVERY_URL}/discovery/v1/kv/services?recurse=1"
    headers:
      X-Simulate-Failover: "true"
    expect_status: 302
    expect_body:
      reason: "NMS_FAILOVER"
      category: "redirect"
      action: "connect_to_alternate"
    expect_header_present: ["Location"]
    expect_header_absent: ["Retry-After", "X-Retry-Jitter-Max"]
    assert_location_is_discovery_endpoint: true

