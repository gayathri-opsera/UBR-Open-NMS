---
name: southbound-internal-error-no-secrets
description: "WO-048: Internal error returns 500 without secret leakage"
timeout_seconds: 30

steps:
  - name: trigger-internal-error
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/check-in"
    headers:
      X-Simulate-Internal-Error: "true"
    body:
      serialNumber: "INT-ERR-001"
      macAddress: "AA:BB:CC:DD:EE:03"
      deviceType: "BTS"
      softwareVersion: "1.0.0"
    expect_status: 500
    expect_body:
      reason: "INTERNAL_ERROR"
      category: "server_error"
      action: "contact_support"
    expect_body_absent_pattern: ["password", "secret", "key", "token", "credential", "panic", "stack", "trace"]

---
name: southbound-realtime-online-gating
description: "WO-048: Online state requires established WSS session"
timeout_seconds: 60

steps:
  - name: check-in-without-realtime
    action: http_post
    url: "${DISCOVERY_URL}/api/v1/discovery/check-in"
    body:
      serialNumber: "WSS-GATE-001"
      macAddress: "AA:BB:CC:DD:EE:04"
      deviceType: "BTS"
      softwareVersion: "1.0.0"
    expect_status: 200

  - name: verify-not-online-yet
    action: http_get
    url: "${INVENTORY_URL}/api/v1/devices/serial/WSS-GATE-001"
    expect_status: 200
    expect_body:
      onlineState: "OFFLINE"
      bootstrapState: "CHECK_IN_RECEIVED"

  - name: establish-wss-session
    action: wss_connect
    url: "${REALTIME_URL}/ws/devices/WSS-GATE-001"
    expect_pong_response: true

  - name: verify-now-online
    action: http_get
    url: "${INVENTORY_URL}/api/v1/devices/serial/WSS-GATE-001"
    expect_status: 200
    expect_body:
      onlineState: "ONLINE"
      bootstrapState: "REALTIME_ESTABLISHED"

---
name: southbound-realtime-timeout-offline
description: "WO-048: WSS timeout marks device offline"
timeout_seconds: 90

steps:
  - name: establish-wss-then-go-silent
    action: wss_connect
    url: "${REALTIME_URL}/ws/devices/WSS-TIMEOUT-001"
    send_ping: false
    wait_for_timeout: 60

  - name: verify-marked-offline
    action: http_get
    url: "${INVENTORY_URL}/api/v1/devices/serial/WSS-TIMEOUT-001"
    expect_status: 200
    expect_body:
      onlineState: "OFFLINE"
      offlineReason: "REALTIME_TIMEOUT"

---
name: southbound-contract-registry-missing-realtime-key
description: "WO-048 Edge: Registry missing services/realtime fails validation"
timeout_seconds: 30

steps:
  - name: get-incomplete-registry
    action: http_get
    url: "${DISCOVERY_URL}/discovery/v1/kv/services?recurse=1"
    mock_response_omit_key: "services/realtime"
    expect_contract_violation: true
    expect_error: "Required service key 'services/realtime' missing from registry"

