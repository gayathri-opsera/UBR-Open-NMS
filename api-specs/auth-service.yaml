openapi: "3.0.3"
info:
  title: UBR NMS Auth Service API
  version: "1.0.0"
  description: >
    Authentication, token management, and user CRUD for UBR NMS.
    Integrates with Airtel NIAM (LDAP/LDAPS), issues RS256 JWT access tokens
    (15-min TTL) and opaque refresh tokens (24-hr in Redis).

servers:
  - url: /api/v1
    description: Via API Gateway

security:
  - BearerAuth: []

tags:
  - name: auth
    description: Login, token refresh, logout
  - name: mfa
    description: Multi-factor authentication (TOTP + backup codes) — WO-014
  - name: sso
    description: Tenant-selectable enterprise SSO (OIDC / SAML 2.0) — WO-013
  - name: users
    description: User CRUD (admin only)

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate user against LDAP/MongoDB
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: jdoe }
                password: { type: string, format: password, example: "P@ssw0rd!2024" }
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:  { type: string }
                  refreshToken: { type: string }
                  expiresIn:    { type: integer, example: 900 }
                  role:         { $ref: 'components.yaml#/components/schemas/UserRole' }
        "400":
          description: Validation error
          content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' }
              example:
                code: INVALID_CREDENTIALS
                message: Username or password is incorrect
        "403":
          description: Account locked
          content:
            application/json:
              schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' }
              example:
                code: ACCOUNT_LOCKED
                message: Account locked due to 5 failed attempts
        "503":
          description: LDAP/Auth service unavailable
          content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange refresh token for new access token
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:  { type: string }
                  refreshToken: { type: string }
                  expiresIn:    { type: integer }
        "401":
          description: Invalid or expired refresh token
          content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } }

  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current session (revokes refresh token)
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204":
          description: Session invalidated
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } }

  /users:
    get:
      tags: [users]
      summary: List all users (admin only)
      operationId: listUsers
      parameters:
        - $ref: 'components.yaml#/components/parameters/QueryOffset'
        - $ref: 'components.yaml#/components/parameters/QueryLimit'
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'components.yaml#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserProfile' }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }

    post:
      tags: [users]
      summary: Create a new user (admin only)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        "201":
          description: User created
          content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }
        "409": { description: Username already exists, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }

  /users/{id}:
    parameters:
      - $ref: 'components.yaml#/components/parameters/PathDeviceId'
    get:
      tags: [users]
      summary: Get user by ID
      operationId: getUser
      responses:
        "200": { description: User found, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }
    put:
      tags: [users]
      summary: Update user role or status (admin only)
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }
    delete:
      tags: [users]
      summary: Delete user (admin only)
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "404": { description: Not found, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }

  /users/{id}/change-password:
    parameters:
      - $ref: 'components.yaml#/components/parameters/PathDeviceId'
    post:
      tags: [users]
      summary: Change user password (admin resets; user changes own)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword:     { type: string, format: password }
      responses:
        "204": { description: Password changed }
        "400": { description: Password complexity violation, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        userId:    { type: string, format: uuid }
        username:  { type: string }
        email:     { type: string, format: email }
        role:      { $ref: 'components.yaml#/components/schemas/UserRole' }
        isActive:  { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 12 }
        email:    { type: string, format: email }
        role:     { $ref: 'components.yaml#/components/schemas/UserRole' }

    UpdateUserRequest:
      type: object
      properties:
        role:     { $ref: 'components.yaml#/components/schemas/UserRole' }
        isActive: { type: boolean }

    # ── WO-013: SSO ───────────────────────────────────────────────────────────

    OIDCConfig:
      type: object
      required: [discoveryUrl, clientId, callbackUrl]
      properties:
        discoveryUrl:    { type: string, format: uri, description: OIDC discovery metadata URL }
        clientId:        { type: string }
        clientSecretRef: { type: string, description: "Vault path reference — raw secret NEVER stored here" }
        callbackUrl:     { type: string, format: uri }
        scopes:          { type: array, items: { type: string }, example: ["openid","profile","email"] }

    SAMLConfig:
      type: object
      required: [entryPoint, issuer, callbackUrl]
      properties:
        metadataUrl: { type: string, format: uri }
        entryPoint:  { type: string, format: uri, description: IdP SSO URL }
        issuer:      { type: string, description: SP entity ID }
        cert:        { type: string, description: IdP signing certificate (PEM) }
        callbackUrl: { type: string, format: uri }

    TenantSSOConfig:
      type: object
      required: [providerType]
      properties:
        tenantId:             { type: string }
        providerType:         { type: string, enum: [local, ldap, oidc, saml] }
        enabled:              { type: boolean, default: true }
        localFallbackEnabled: { type: boolean, default: true }
        displayName:          { type: string }
        oidc:                 { $ref: '#/components/schemas/OIDCConfig' }
        saml:                 { $ref: '#/components/schemas/SAMLConfig' }
        claimMapping:
          type: object
          properties:
            email:    { type: string, default: email }
            username: { type: string, default: preferred_username }
            role:     { type: string, default: role }
        defaultRole: { type: string, enum: [admin, operator, user], default: user }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    SSOTokenResponse:
      type: object
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }
        expiresIn:    { type: integer, example: 900 }
        role:         { type: string }
        userId:       { type: string }

    # ── WO-014: MFA ───────────────────────────────────────────────────────────

    MFASetupResponse:
      type: object
      properties:
        otpauthUrl:  { type: string, description: "otpauth:// URL for QR code generation" }
        secret:      { type: string, description: Base32 TOTP secret (shown once) }
        qrCode:      { type: string, description: Base64 PNG QR code image }

    BackupCodesResponse:
      type: object
      properties:
        codes:
          type: array
          items: { type: string }
          description: "8 single-use backup codes (shown once; store securely)"

# ── WO-013 SSO paths ──────────────────────────────────────────────────────────

x-sso-paths:
  /auth/sso/initiate:
    post:
      tags: [sso]
      summary: Initiate enterprise SSO login
      security: []
      operationId: ssoInitiate
      parameters:
        - in: header
          name: X-Tenant-ID
          schema: { type: string }
          description: Tenant identifier (falls back to hostname subdomain)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [oidc, saml], description: Override auto-detected provider }
      responses:
        "200":
          description: OIDC — returns authorization URL for client-side redirect
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUrl: { type: string, format: uri }
                  provider:    { type: string }
        "302":
          description: SAML — server-side redirect to IdP entry point
        "404":
          description: Tenant SSO not configured

  /auth/sso/callback/oidc:
    get:
      tags: [sso]
      summary: OIDC authorization code callback
      security: []
      operationId: oidcCallback
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "200":
          description: SSO login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSOTokenResponse' }
        "401":
          description: Invalid state or IdP error

  /auth/sso/callback/saml:
    post:
      tags: [sso]
      summary: SAML assertion callback (HTTP-POST binding)
      security: []
      operationId: samlCallback
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse: { type: string }
                RelayState:   { type: string }
      responses:
        "200":
          description: SAML login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSOTokenResponse' }
        "401":
          description: Invalid or tampered SAML assertion

  /auth/sso/metadata:
    get:
      tags: [sso]
      summary: SAML Service Provider metadata
      security: []
      operationId: samlMetadata
      responses:
        "200":
          description: SP metadata XML
          content:
            application/xml:
              schema: { type: string }

  /auth/sso/config:
    get:
      tags: [sso]
      summary: Read tenant SSO configuration (admin)
      operationId: getSSOConfig
      responses:
        "200":
          description: Current tenant SSO config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSSOConfig' }
        "404":
          description: Not configured
    put:
      tags: [sso]
      summary: Create or update tenant SSO configuration (admin)
      operationId: upsertSSOConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantSSOConfig' }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSSOConfig' }

# ── WO-014 MFA paths ──────────────────────────────────────────────────────────

x-mfa-paths:
  /auth/mfa/setup:
    post:
      tags: [mfa]
      summary: Generate TOTP secret and QR code for enrollment
      operationId: mfaSetup
      responses:
        "200":
          description: TOTP setup material (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFASetupResponse' }

  /auth/mfa/verify:
    post:
      tags: [mfa]
      summary: Verify TOTP token to complete MFA enrollment or challenge
      operationId: mfaVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: "^[0-9]{6}$", description: 6-digit TOTP code }
      responses:
        "200":
          description: MFA verified — returns MFA-assured access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string, description: "JWT with mfaVerified: true claim" }
        "401":
          description: Invalid TOTP token

  /auth/mfa/backup-codes:
    post:
      tags: [mfa]
      summary: Generate backup codes (admin-required action)
      operationId: generateBackupCodes
      responses:
        "200":
          description: 8 single-use backup codes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupCodesResponse' }

  /auth/mfa/backup-codes/verify:
    post:
      tags: [mfa]
      summary: Use a backup code to complete MFA
      operationId: verifyBackupCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, backupCode]
              properties:
                mfaToken:   { type: string, description: Short-lived MFA challenge token }
                backupCode: { type: string, description: Single-use backup code }
      responses:
        "200":
          description: Backup code accepted — returns MFA-assured token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        "401":
          description: Invalid or already-used backup code
