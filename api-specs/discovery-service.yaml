openapi: "3.0.3"
info:
  title: UBR NMS Discovery Service API
  version: "1.0.0"
  description: >
    Device onboarding and discovery management for UBR NMS.
    Handles mTLS check-in, SNMP/ICMP scan triggers, and discovery status.

servers:
  - url: /api/v1
    description: Via API Gateway
  - url: /discovery/v1
    description: Southbound UBR call-home (direct to discovery service, mTLS)

security:
  - BearerAuth: []

tags:
  - name: discovery
    description: Device discovery and scan management

paths:
  /discovery/scan:
    post:
      tags: [discovery]
      summary: Trigger a network discovery scan (operator+)
      operationId: triggerScan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        "202": { description: Scan started, content: { application/json: { schema: { $ref: '#/components/schemas/ScanJob' } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }

  /discovery/scan/{scanId}/status:
    parameters:
      - name: scanId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [discovery]
      summary: Get scan job status
      operationId: getScanStatus
      responses:
        "200": { description: Scan status, content: { application/json: { schema: { $ref: '#/components/schemas/ScanJob' } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }

  /discovery/check-in:
    post:
      tags: [discovery]
      summary: Device self-registration at first boot (mTLS endpoint)
      operationId: deviceCheckIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'components.yaml#/components/schemas/BirthCertificate' }
      responses:
        "201": { description: Device registered and birth certificate stored, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInResponse' } } } }
        "400": { description: Malformed payload or missing required fields, content: { application/json: { schema: { $ref: '#/components/schemas/SouthboundErrorBody' } } } }
        "409": { description: Device already registered, content: { application/json: { schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' } } } }
        "403": { description: Discovery mode disabled, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryModeDisabledError' } } } }
        "429":
          description: Rate limited — include Retry-After and X-Retry-Jitter-Max headers
          headers:
            Retry-After:        { schema: { type: integer }, description: Seconds to wait before retrying }
            X-Retry-Jitter-Max: { schema: { type: integer }, description: Max jitter seconds to add to retry delay }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "462":
          description: HMAC-SHA256 integrity check failed — no retry headers (auth failure)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "495":
          description: mTLS certificate invalid — no retry headers (auth failure)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "496":
          description: No mTLS certificate presented — no retry headers (auth failure)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "302":
          description: NMS failover redirect — follow Location header
          headers:
            Location: { schema: { type: string, format: uri }, description: Alternate NMS discovery endpoint }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "503":
          description: Service temporarily unavailable — retry with Retry-After
          headers:
            Retry-After:        { schema: { type: integer } }
            X-Retry-Jitter-Max: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }

  # ── WO-009: Southbound service registry for UBR call-home ─────────────────
  /kv/services:
    get:
      tags: [southbound]
      summary: Southbound service registry for UBR call-home bootstrap (mTLS only)
      operationId: getServiceRegistry
      description: >
        Returns Consul-style KV entries with base64-encoded service metadata for
        authentication, check-in, event, and realtime WebSocket services. UBR devices
        use this endpoint during bootstrap to discover service locations without hardcoded URLs.
      security: []
      parameters:
        - name: recurse
          in: query
          required: true
          description: Must be "1" per firmware contract
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Service registry KV array (Consul-style)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KVEntry' }
        "400":
          description: Bad request (recurse != 1 or malformed query)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "503":
          description: Service registry configuration incomplete
          headers:
            Retry-After:        { schema: { type: integer } }
            X-Retry-Jitter-Max: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }

  # ── WO-010: Device authentication for per-device HMAC secrets ────────────
  /device:
    post:
      tags: [southbound]
      summary: Device authentication endpoint for UBR call-home (mTLS only)
      operationId: authenticateDevice
      description: >
        Issues a unique per-device HMAC secret to authorized UBR devices. Devices exchange
        serial number and MAC address for a signing secret used in subsequent call-home requests.
        Unauthorized or removed devices receive HTTP 404 with no secret disclosure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceAuthRequest' }
      responses:
        "200":
          description: Device authenticated successfully, secret issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthResponse' }
        "400":
          description: Bad request (malformed payload or validation failure)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "404":
          description: Device not found or not authorized
          content:
            application/json:
              schema: { $ref: 'components.yaml#/components/schemas/ErrorResponse' }
        "503":
          description: Authentication service unavailable (secret store failure)
          headers:
            Retry-After:        { schema: { type: integer } }
            X-Retry-Jitter-Max: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SouthboundErrorBody' }

  /discovery/modes:
    get:
      tags: [discovery]
      summary: Get current discovery mode state for both modes (any authenticated role)
      operationId: getDiscoveryModes
      responses:
        "200":
          description: Current discovery mode policies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryModesResponse' }
        "401": { description: Unauthorized }

  /discovery/modes/{mode}:
    parameters:
      - name: mode
        in: path
        required: true
        schema: { type: string, enum: [UBR_CALL_HOME, GENERIC_DISCOVERY] }
    put:
      tags: [discovery]
      summary: Update discovery mode policy (admin only)
      operationId: updateDiscoveryMode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDiscoveryModeRequest' }
      responses:
        "200": { description: Updated policy, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryModeEntry' } } } }
        "400": { description: Malformed rolloutLevel or missing reason }
        "403": { description: Non-admin caller or denied audit event }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ScanRequest:
      type: object
      required: [subnetCidr]
      properties:
        subnetCidr:  { type: string, example: "10.10.1.0/24" }
        protocol:    { type: string, enum: [SNMP, ICMP, both], default: both }
        snmpCommunity: { type: string, default: public }
        timeoutMs:   { type: integer, default: 5000 }

    ScanJob:
      type: object
      properties:
        scanId:       { type: string, format: uuid }
        status:       { type: string, enum: [pending, running, completed, failed] }
        subnetCidr:   { type: string }
        devicesFound: { type: integer }
        startedAt:    { type: string, format: date-time }
        completedAt:  { type: string, format: date-time, nullable: true }

    CheckInResponse:
      type: object
      properties:
        deviceId:   { type: string, format: uuid }
        registered: { type: boolean }
        message:    { type: string }

    DiscoveryModeEntry:
      type: object
      properties:
        enabled:        { type: boolean }
        rolloutLevel:   { type: string, enum: [disabled, beta, production] }
        betaSignoffRef: { type: ["string", "null"] }
        updatedBy:      { type: ["string", "null"] }
        updatedAt:      { type: ["string", "null"], format: date-time }
        reason:         { type: ["string", "null"] }

    DiscoveryModesResponse:
      type: object
      properties:
        genericDiscovery: { $ref: '#/components/schemas/DiscoveryModeEntry' }
        ubrCallHome:      { $ref: '#/components/schemas/DiscoveryModeEntry' }

    UpdateDiscoveryModeRequest:
      type: object
      required: [reason]
      properties:
        enabled:        { type: boolean }
        rolloutLevel:   { type: string, enum: [disabled, beta, production] }
        betaSignoffRef: { type: string }
        reason:         { type: string, minLength: 1 }

    DiscoveryModeDisabledError:
      type: object
      properties:
        error:   { type: string, example: DISCOVERY_MODE_DISABLED }
        mode:    { type: string }
        message: { type: string }

    # ── WO-010: Device authentication models ─────────────────────────────────
    DeviceAuthRequest:
      description: Request payload for device authentication (WO-010)
      type: object
      required: [serialNumber, macAddress, deviceType]
      properties:
        serialNumber:    { type: string, minLength: 8, maxLength: 32, example: "UBR-BTS-12345678" }
        macAddress:      { type: string, pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$", example: "AA:BB:CC:DD:EE:FF" }
        deviceType:      { type: string, enum: [BTS, CPE, IDU], example: "BTS" }
        firmwareVersion: { type: string, example: "v2.3.1" }

    DeviceAuthResponse:
      description: Successful authentication response with per-device secret (WO-010)
      type: object
      required: [deviceId, serialNumber, macAddress, secret, issuedAt, keyVersion]
      properties:
        deviceId:     { type: string, format: uuid }
        serialNumber: { type: string }
        macAddress:   { type: string }
        secret:       { type: string, description: "HMAC signing secret (NEVER log this value)" }
        issuedAt:     { type: string, format: date-time }
        expiresAt:    { type: string, format: date-time, nullable: true }
        keyVersion:   { type: integer, minimum: 1 }

    # ── WO-009: Service registry models ─────────────────────────────────────
    KVEntry:
      description: Consul-style KV entry for service registry
      type: object
      required: [LockIndex, Key, Flags, Value, CreateIndex, ModifyIndex]
      properties:
        LockIndex:   { type: integer, example: 0 }
        Key:         { type: string, example: "services/auth" }
        Flags:       { type: integer, example: 0 }
        Value:       { type: string, description: Base64-encoded ServiceMetadata JSON }
        CreateIndex: { type: integer }
        ModifyIndex: { type: integer }

    ServiceMetadata:
      description: Decoded Value payload for each service (base64-encoded in KVEntry.Value)
      type: object
      required: [scheme, address]
      properties:
        scheme:       { type: string, enum: [http, https, ws, wss] }
        address:      { type: string, description: "host:port or IPv6 literal [::1]:port" }
        auth_path:    { type: string, example: "/api/v1/auth/device" }
        checkin_path: { type: string, example: "/api/v1/checkin" }
        event_path:   { type: string, example: "/api/v1/events" }
        ws_path:      { type: string, example: "/ws/v1/realtime" }

    # ── WO-005: Southbound error shapes ─────────────────────────────────────
    SouthboundErrorBody:
      description: >
        Canonical error response body returned by discovery-service southbound endpoints.
        Auth failures (462, 495, 496) never carry retry hints.
        Retryable errors (429, 503) include Retry-After and X-Retry-Jitter-Max response headers.
        Failover (302) includes a Location header pointing to the alternate NMS endpoint.
        Secrets, HMAC values, and private keys must never appear in this body.
      type: object
      required: [reason, category, message, correlationId, timestamp]
      properties:
        reason:
          type: string
          enum:
            - BAD_REQUEST
            - MTLS_CERT_INVALID
            - MTLS_NO_CERT
            - HMAC_INVALID
            - RATE_LIMITED
            - NMS_FAILOVER
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        category:
          type: string
          enum: [auth_failure, retryable, redirect, client_error, server_error]
        message:        { type: string }
        correlationId:  { type: string, description: Request correlation ID for log tracing }
        timestamp:      { type: string, format: date-time }

    SouthboundErrorEvent:
      description: >
        Kafka message published to audit/alarm topics when a southbound security
        or protocol error occurs. Must never include secrets, HMAC values, or keys.
      type: object
      required: [eventId, correlationId, errorReason, errorCategory, httpStatus, timestamp, serviceId]
      properties:
        eventId:        { type: string, format: uuid }
        correlationId:  { type: string }
        deviceSerial:   { type: string, description: Sanitised device identity only — no credentials }
        errorReason:    { type: string }
        errorCategory:  { type: string }
        httpStatus:     { type: integer }
        timestamp:      { type: string, format: date-time }
        serviceId:      { type: string }
