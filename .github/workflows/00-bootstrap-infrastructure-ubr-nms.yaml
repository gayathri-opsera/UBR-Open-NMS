name: "00 - Bootstrap: UBR NMS Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to bootstrap'
        required: true
        type: choice
        options: [dev, qa, staging, prod, all]
        default: dev

env:
  TENANT: opsera
  APP_NAME: ubr-nms
  AWS_REGION: us-west-2
  HUB_CLUSTER: argocd-usw2
  SPOKE_CLUSTER: opsera-usw2-np
  ARGOCD_SERVER: argocd-usw2.agent.opsera.dev

jobs:
  # ── 01 Pre-flight Checks ─────────────────────────────────────
  preflight:
    name: "01 - Pre-flight Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account Info
        run: |
          AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS Account: $AWS_ACCOUNT"
          echo "Region: ${{ env.AWS_REGION }}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Check EKS Clusters
        run: |
          echo "Checking hub cluster: ${{ env.HUB_CLUSTER }}"
          aws eks describe-cluster --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }} \
            --query 'cluster.status' --output text 2>/dev/null || echo "⚠️  Hub cluster not found"
          echo "Checking spoke cluster: ${{ env.SPOKE_CLUSTER }}"
          aws eks describe-cluster --name ${{ env.SPOKE_CLUSTER }} --region ${{ env.AWS_REGION }} \
            --query 'cluster.status' --output text 2>/dev/null || echo "⚠️  Spoke cluster not found"

      - name: Check ArgoCD Registration
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
            echo "Hub cluster kubeconfig skipped (cluster may not exist yet)"
          kubectl get secret -n argocd -l argocd.argoproj.io/secret-type=cluster 2>/dev/null | \
            grep ${{ env.SPOKE_CLUSTER }} && echo "✅ Spoke registered" || echo "⚠️  Spoke not registered yet"

  # ── 02 ECR Repositories ──────────────────────────────────────
  ecr-setup:
    name: "02 - ECR Repositories"
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR Repositories (Idempotent)
        run: |
          create_repo() {
            REPO="$1"
            if aws ecr describe-repositories --repository-names "$REPO" --region ${{ env.AWS_REGION }} &>/dev/null; then
              echo "✅ ECR repo exists: $REPO"
            else
              aws ecr create-repository --repository-name "$REPO" --region ${{ env.AWS_REGION }} \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256
              echo "✅ Created ECR repo: $REPO"
            fi
          }

          create_repo "opsera/ubr-nms-frontend"
          create_repo "opsera/ubr-nms-api-gateway"
          create_repo "opsera/ubr-nms-auth-service"
          create_repo "opsera/ubr-nms-audit-service"
          create_repo "opsera/ubr-nms-notification-service"
          create_repo "opsera/ubr-nms-alarm-service"
          create_repo "opsera/ubr-nms-config-service"
          create_repo "opsera/ubr-nms-diagnostics-service"
          create_repo "opsera/ubr-nms-health-monitor"
          create_repo "opsera/ubr-nms-inventory-service"
          create_repo "opsera/ubr-nms-kpi-aggregation-service"
          create_repo "opsera/ubr-nms-kpi-query-service"
          create_repo "opsera/ubr-nms-report-service"
          create_repo "opsera/ubr-nms-topology-service"
          create_repo "opsera/ubr-nms-config-push-worker"
          create_repo "opsera/ubr-nms-discovery-service"
          create_repo "opsera/ubr-nms-event-collector"
          create_repo "opsera/ubr-nms-kpi-collector"
          create_repo "opsera/ubr-nms-mobinet-sync"
          create_repo "opsera/ubr-nms-mycom-forwarder"
          create_repo "opsera/ubr-nms-netcool-forwarder"
          create_repo "opsera/ubr-nms-syslog-forwarder"

  # ── 03 ArgoCD Configuration ───────────────────────────────────
  argocd-setup:
    name: "03 - ArgoCD Configuration"
    runs-on: ubuntu-latest
    needs: [preflight, ecr-setup]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to Hub Cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Register Spoke Cluster in ArgoCD (Idempotent)
        run: |
          SPOKE_ARN=$(aws eks describe-cluster --name ${{ env.SPOKE_CLUSTER }} \
            --region ${{ env.AWS_REGION }} --query 'cluster.arn' --output text 2>/dev/null || echo "")
          if [ -z "$SPOKE_ARN" ]; then
            echo "⚠️  Spoke cluster not found, skipping registration"
            exit 0
          fi
          if kubectl get secret -n argocd -l argocd.argoproj.io/secret-type=cluster 2>/dev/null | \
              grep -q ${{ env.SPOKE_CLUSTER }}; then
            echo "✅ Spoke already registered"
          else
            kubectl apply -f - <<'MANIFEST'
          apiVersion: v1
          kind: Secret
          metadata:
            name: opsera-usw2-np
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: cluster
          type: Opaque
          stringData:
            name: opsera-usw2-np
            server: https://kubernetes.default.svc
            config: '{"execProviderConfig":{"command":"aws","args":["eks","get-token","--cluster-name","opsera-usw2-np"],"apiVersion":"client.authentication.k8s.io/v1beta1"}}'
          MANIFEST
            echo "✅ Spoke cluster registered"
          fi

      - name: Setup ArgoCD Repository Secret (Idempotent)
        run: |
          if kubectl get secret -n argocd ubr-nms-repo &>/dev/null; then
            echo "✅ ArgoCD repo secret exists"
          else
            kubectl create secret generic ubr-nms-repo \
              --namespace argocd \
              --from-literal=type=git \
              --from-literal=url=https://github.com/gayathri-opsera/UBR-Open-NMS.git \
              --from-literal=password=${{ secrets.GH_PAT }} \
              --from-literal=username=x-access-token
            kubectl label secret ubr-nms-repo -n argocd argocd.argoproj.io/secret-type=repository
            echo "✅ ArgoCD repo secret created"
          fi

  # ── 04 Kubernetes Setup ───────────────────────────────────────
  k8s-setup:
    name: "04 - Kubernetes Setup"
    runs-on: ubuntu-latest
    needs: [preflight, argocd-setup]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to Spoke Cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.SPOKE_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Setup Namespaces (Idempotent)
        run: |
          INPUT_ENV="${{ inputs.environment }}"
          if [ "$INPUT_ENV" = "all" ]; then
            ENVS="dev qa staging prod"
          else
            ENVS="$INPUT_ENV"
          fi
          for E in $ENVS; do
            NS="opsera-ubr-nms-$E"
            kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
            echo "✅ Namespace ready: $NS"
          done

  # ── 05 Verification ───────────────────────────────────────────
  verify:
    name: "05 - Verification"
    runs-on: ubuntu-latest
    needs: [preflight, ecr-setup, argocd-setup, k8s-setup]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify All Components
        run: |
          echo "=== ECR Repositories ==="
          aws ecr describe-repositories --region ${{ env.AWS_REGION }} \
            --query 'repositories[?starts_with(repositoryName, `opsera/ubr-nms`)].repositoryName' \
            --output table

          echo "=== Namespaces ==="
          aws eks update-kubeconfig --name ${{ env.SPOKE_CLUSTER }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
          kubectl get namespaces | grep opsera-ubr-nms || echo "No namespaces yet"

          echo "✅ Bootstrap verification complete"
