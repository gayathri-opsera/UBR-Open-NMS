name: Documentation Validation

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'api-specs/**'
      - 'scripts/docs/**'
  push:
    branches: [main]

jobs:
  validate-docs:
    name: Validate Documentation Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run documentation validator
        run: node scripts/docs/validate-docs.mjs

  sync-api-reference:
    name: Sync API Reference from OpenAPI Specs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync API reference from api-specs/
        run: node scripts/docs/sync-api-reference.mjs

      - name: Commit if reference changed
        run: |
          git config user.name "UBR Docs Bot"
          git config user.email "docs-bot@ubrnms.local"
          git add frontend/src/data/docs/reference/index.ts
          if git diff --cached --quiet; then
            echo "No API reference changes."
          else
            git commit -m "docs: auto-sync API Reference from api-specs/ [skip ci]"
            git push
          fi
