name: UBR NMS — Buf Schema Governance (WO-017)

# Runs `buf lint` and `buf breaking` on every PR that touches proto/ files.
# On merge to main, pushes the validated schemas to the Buf Schema Registry (BSR).

on:
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - ".github/workflows/buf-schema-ci.yml"
  pull_request:
    paths:
      - "proto/**"
      - ".github/workflows/buf-schema-ci.yml"

jobs:
  # ── Lint & Breaking-change checks (on every PR) ────────────────────────────
  buf-lint:
    name: Buf Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for buf breaking --against

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.34.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: buf lint
        working-directory: proto

  buf-breaking:
    name: Buf Breaking-Change Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.34.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for breaking changes against main
        # Compare the PR branch against the most recent commit on main.
        # A breaking change (deleted field, changed type, etc.) fails the job
        # and prevents the PR from merging.
        run: |
          buf breaking --against ".git#branch=origin/main,subdir=proto"
        working-directory: proto
        continue-on-error: false
        env:
          # Retry on transient network errors (edge case: BSR connectivity).
          BUF_NETWORK_RETRIES: "3"

  # ── Publish to Buf Schema Registry (on merge to main only) ─────────────────
  buf-push:
    name: Publish to Buf Schema Registry
    runs-on: ubuntu-latest
    needs: buf-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.34.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push schemas to BSR
        uses: bufbuild/buf-push-action@v1
        with:
          input: proto
          buf_token: ${{ secrets.BUF_TOKEN }}
          # Draft label prevents the new schema from being used as the default
          # production version until it has been manually promoted.
          draft: ${{ github.ref_name != 'main' }}
