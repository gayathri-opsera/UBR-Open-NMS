[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ubrnms-shared-libs"
version = "1.0.0"
description = "Shared utility libraries for UBR NMS Python services"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21"]
# Proto code generation (WO-024) — install with: pip install ubrnms-shared-libs[proto]
proto = ["grpcio-tools>=1.62.0", "mypy-protobuf>=3.5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
