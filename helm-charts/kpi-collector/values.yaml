replicaCount: 2

image:
  repository: ubrnms/kpi-collector
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 8
  maxReplicas: 30
  targetCPUUtilizationPercentage: 50

probes:
  liveness:
    initialDelaySeconds: 45
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5

namespace: ubr-platform

nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

env:
  - name: SERVICE_NAME
    value: "kpi-collector"

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ubr-platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ubr-ingress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ubr-data
