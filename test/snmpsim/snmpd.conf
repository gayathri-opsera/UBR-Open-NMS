# snmpd.conf — UBR NMS SNMP Test Simulator
#
# Simulates a Linux network device responding to MIB-II system OIDs.
# Runs on non-privileged port 1161 inside the container (no root needed).
# The sysObjectID (.1.3.6.1.4.1.8072.3.2.10) is set automatically by net-snmp
# for a Linux x86_64 host. The UBR NMS classifier maps .1.3.6.1.4.1.8072.3
# to: Vendor: Net-SNMP  Model: Linux  GenericDeviceType: SERVER

# ── Agent transport ───────────────────────────────────────────────────────────

# Use non-privileged port 1161 to avoid needing root or CAP_NET_BIND_SERVICE.
# Docker compose maps host:1161/udp → container:1161/udp.
agentAddress udp:0.0.0.0:1161

# ── Access control ────────────────────────────────────────────────────────────

# Read-only community "public" from any host.
rocommunity public default

# ── System identity ───────────────────────────────────────────────────────────

# Standard MIB-II system group read-write settings (net-snmp native directives).
# These are NOT override directives — they set initial values through the agent's
# own MIB write path, avoiding duplicate-registration conflicts.
sysLocation "UBR NMS Test Lab — Docker"
sysContact  "admin@ubrnms.local"
sysName     "ubr-nms-snmpsim"
sysDescr    "Linux ubr-nms-snmpsim 5.15.0-91-generic x86_64 (net-snmp UBR NMS test agent)"

# ── Logging ───────────────────────────────────────────────────────────────────

# Disable persistent disk writes (agent runs in an ephemeral container).
# Note: noPersistentStorage is not recognised in all snmpd versions — use
# the equivalent run-time flag -d in CMD instead.
