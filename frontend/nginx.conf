server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (REQ-019 / OWASP) ──────────────────────────────────
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Enable XSS filter in legacy browsers
    add_header X-XSS-Protection "1; mode=block" always;
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict powerful features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    # Content Security Policy — tight policy allowing only same-origin + CDN fonts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;
    # HSTS — 1 year, include subdomains (enable after TLS is confirmed)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Always fetch fresh index.html — prevent browser from caching the SPA shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed JS/CSS assets can be cached aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the gateway inside the Docker network
    location /api/ {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE support for real-time alarm stream
    location /api/v1/alarms/stream {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/wasm image/svg+xml;
}
