spring:
  threads:
    virtual:
      enabled: true  # Java 21 Virtual Threads (WO-006)
  application:
    name: alarm-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/ubrnms_alarms}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: alarm-service
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # Cap the time kafkaTemplate.send() blocks waiting for topic metadata.
        # Without this, a missing Kafka broker causes the HTTP thread to stall for
        # the default 60 s (two consecutive sends = 2×60s), making every alarm
        # evaluation request time out from the caller.  In dev Kafka is optional;
        # when absent the publish is logged and skipped (non-fatal in 1-2s total).
        max.block.ms: 1000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
    listener:
      ack-mode: MANUAL_IMMEDIATE

server:
  port: ${PORT:8083}

logging:
  level:
    # Spring Kafka's LoggingProducerListener logs ERROR for every failed async send.
    # Kafka is optional in dev (no broker running); suppress to WARN so it doesn't
    # flood monitors.  Real alarm data is already persisted in MongoDB before publish.
    org.springframework.kafka.support.LoggingProducerListener: WARN
    org.apache.kafka.clients.NetworkClient: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

kafka:
  topics:
    raw-alarms: ${KAFKA_TOPIC_RAW_ALARMS:raw-alarms}
    processed-alarms: ${KAFKA_TOPIC_PROCESSED_ALARMS:processed-alarms}
    netcool-alarms-forward: ${KAFKA_TOPIC_NETCOOL:netcool-alarms-forward}

alarm:
  dedup:
    window-minutes: ${ALARM_DEDUP_WINDOW_MINUTES:5}
  retention-days: ${ALARM_RETENTION_DAYS:7}
  export:
    max-rows: ${ALARM_EXPORT_MAX_ROWS:10000}
