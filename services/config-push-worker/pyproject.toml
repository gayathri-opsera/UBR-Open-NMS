[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "config-push-worker"
version = "1.0.0"
description = "UBR NMS Config Push Worker — NETCONF/CLI/TR-069 southbound device configuration"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10.0",
    "motor>=3.3.2",
    "ncclient>=0.6.15",
    "paramiko>=3.4.0",
    "prometheus-client>=0.20.0",
    "aiohttp>=3.9.5",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
