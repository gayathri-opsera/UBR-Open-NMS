spring:
  threads:
    virtual:
      enabled: true  # Java 21 Virtual Threads
  application:
    name: product-definition-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/ubrnms_productdef}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

server:
  port: ${PORT:8093}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

product-definition:
  upload:
    max-file-size-bytes: ${MAX_UPLOAD_BYTES:10485760}  # 10 MB

logging:
  level:
    com.ubrnms: ${LOG_LEVEL:INFO}
