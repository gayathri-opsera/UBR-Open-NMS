apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcool-forwarder
  labels:
    app: netcool-forwarder
    tenant: opsera
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: netcool-forwarder
  template:
    metadata:
      labels:
        app: netcool-forwarder
        tenant: opsera
    spec:
      serviceAccountName: ubr-nms
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: netcool-forwarder
          image: PLACEHOLDER_NETCOOL_FORWARDER_ECR_URI
          ports:
            - containerPort: 9090
          env:
            - name: KAFKA_BROKERS
              value: "kafka.opsera-ubr-nms-dev.svc.cluster.local:9092"
            - name: KAFKA_ENABLED
              value: "true"
            - name: ENV
              value: "dev"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 100
