apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpi-query-service
  labels:
    app: kpi-query-service
    tenant: opsera
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kpi-query-service
  template:
    metadata:
      labels:
        app: kpi-query-service
        tenant: opsera
    spec:
      serviceAccountName: ubr-nms
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: kpi-query-service
          image: PLACEHOLDER_KPI_QUERY_SERVICE_ECR_URI
          ports:
            - containerPort: 8089
          env:
            - name: REDIS_HOST
              value: "redis.opsera-ubr-nms-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: MONGO_URI
              value: "mongodb://mongodb.opsera-ubr-nms-dev.svc.cluster.local:27017/ubr_nms"
            - name: KAFKA_BROKERS
              value: "kafka.opsera-ubr-nms-dev.svc.cluster.local:9092"
            - name: KAFKA_ENABLED
              value: "true"
            - name: ENV
              value: "dev"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 90
            periodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 100
