apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpi-collector
  labels:
    app: kpi-collector
    tenant: opsera
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kpi-collector
  template:
    metadata:
      labels:
        app: kpi-collector
        tenant: opsera
    spec:
      serviceAccountName: ubr-nms
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: kpi-collector
          image: PLACEHOLDER_KPI_COLLECTOR_ECR_URI
          ports:
            - containerPort: 8087
          env:
            - name: KAFKA_BROKERS
              value: "kafka.opsera-ubr-nms-dev.svc.cluster.local:9092"
            - name: KAFKA_ENABLED
              value: "true"
            - name: ENV
              value: "dev"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 100
