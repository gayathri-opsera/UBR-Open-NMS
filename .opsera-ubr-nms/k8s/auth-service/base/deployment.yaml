apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    tenant: opsera
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tenant: opsera
    spec:
      serviceAccountName: ubr-nms
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: auth-service
          image: PLACEHOLDER_AUTH_SERVICE_ECR_URI
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: ENV
              value: "dev"
            - name: AUTH_PORT
              value: "3001"
            - name: MONGO_URI
              value: "mongodb://mongodb.opsera-ubr-nms-dev.svc.cluster.local:27017/ubr_nms"
            - name: REDIS_HOST
              value: "redis.opsera-ubr-nms-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: CORS_ORIGIN
              value: "https://ubr-nms-dev.opsera.io"
            - name: MAX_FAILED_ATTEMPTS
              value: "100"
            - name: LOCKOUT_DURATION_SECONDS
              value: "60"
            - name: MAX_CONCURRENT_SESSIONS
              value: "10"
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_PUBLIC_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 100
