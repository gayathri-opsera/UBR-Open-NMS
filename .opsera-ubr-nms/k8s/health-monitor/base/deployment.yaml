apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  labels:
    app: health-monitor
    tenant: opsera
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: health-monitor
  template:
    metadata:
      labels:
        app: health-monitor
        tenant: opsera
    spec:
      serviceAccountName: ubr-nms
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: health-monitor
          image: PLACEHOLDER_HEALTH_MONITOR_ECR_URI
          ports:
            - containerPort: 8092
          env:
            - name: ENV
              value: "dev"
            - name: MONGO_URI
              value: "mongodb://mongodb.opsera-ubr-nms-dev.svc.cluster.local:27017/ubr_nms"
            - name: KAFKA_BROKERS
              value: "kafka.opsera-ubr-nms-dev.svc.cluster.local:9092"
            - name: KAFKA_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_KAFKA_ENABLED
              value: "false"
            - name: MANAGEMENT_HEALTH_MONGO_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 100
